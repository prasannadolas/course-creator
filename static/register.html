<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ThinkForge — Create Account</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a6b4a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css">
  
  <style>
    /* Auth-specific layout using main theme variables */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 24px;
    }
     .back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-decoration: none;
  margin-bottom: 24px;
  transition: color var(--transition);
}

.back-link:hover {
  color: var(--text-primary);
}

.back-link svg {
  width: 16px;
  height: 16px;
  transition: transform var(--transition);
}

.back-link:hover svg {
  transform: translateX(-3px);
}
    
    .auth-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-card);
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #2a8b61);
      display: flex; align-items: center; justify-content: center; color: white;
    }
    .brand-name { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--text-primary); }

    .card-heading { font-family: var(--font-display); font-size: 28px; font-weight: 400; line-height: 1.2; margin-bottom: 6px; }
    .card-heading em { font-style: italic; color: var(--accent); }
    .card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      color: var(--text-primary); font-family: var(--font-body); font-size: 15px;
      outline: none; transition: all var(--transition);
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

    /* Password strength */
    .strength-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; width: 0%; transition: all 0.3s ease; }
    .strength-label { font-size: 12px; font-weight: 600; margin-top: 6px; }

    .banner {
      display: none; padding: 12px 14px; border-radius: var(--radius-md);
      font-size: 13px; margin-bottom: 20px; align-items: center; gap: 8px; font-weight: 500;
    }
    .banner.error  { display: flex; background: var(--danger-light); color: var(--danger); border: 1px solid rgba(180,35,24,0.16); }
    .banner.success{ display: flex; background: var(--success-light); color: var(--success); border: 1px solid rgba(21,127,82,0.2); }

    .submit-btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #2a8b61);
      color: #fff; border: none; border-radius: var(--radius-full);
      font-family: var(--font-body); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all var(--transition); margin-top: 8px;
    }
    .submit-btn:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(26,107,74,0.24); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .spinner {
      display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    .submit-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card-footer { text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 24px; }
    .card-footer a { color: var(--accent); text-decoration: none; font-weight: 600; transition: color var(--transition); }
    .card-footer a:hover { color: #114a33; }
  </style>
</head>
<body>

<div class="auth-card">
  
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Home
  </a>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="brand-name">ThinkForge</span>
  </div>

  <h1 class="card-heading">Create your <em>account.</em></h1>
  <p class="card-sub">Join ThinkForge and start building courses.</p>

  <div class="banner" id="banner">
    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    <span id="banner-msg"></span>
  </div>

  <div class="field">
    <label for="reg-name">Full name</label>
    <input type="text" id="reg-name" placeholder="Enter your name" autocomplete="name"/>
  </div>
  <div class="field">
    <label for="reg-email">Email address</label>
    <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label for="reg-password">Password</label>
    <input type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="updateStrength(this.value)"/>
    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
    <div class="strength-label" id="strength-label"></div>
  </div>
  
  <button class="submit-btn" id="register-btn" onclick="handleRegister()">
    <span class="spinner"></span>
    <span class="btn-text">Create Account</span>
  </button>

  <div class="card-footer">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<script>
const API = ""; 

function showBanner(msg, type = "error") {
  const el = document.getElementById("banner");
  el.className = `banner ${type}`;
  document.getElementById("banner-msg").textContent = msg;
}
function hideBanner() { document.getElementById("banner").className = "banner"; }
function setLoading(loading) {
  const btn = document.getElementById("register-btn");
  btn.disabled = loading;
  btn.classList.toggle("loading", loading);
}

function updateStrength(val) {
  const fill = document.getElementById("strength-fill");
  const label = document.getElementById("strength-label");
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  // Access CSS variables from your style.css for perfect matching
  const levels = [
    { pct: "0%",   color: "var(--surface2)", text: "" },
    { pct: "25%",  color: "var(--danger)",   text: "Weak" },
    { pct: "50%",  color: "var(--warn)",     text: "Fair" },
    { pct: "75%",  color: "var(--success)",  text: "Good" },
    { pct: "100%", color: "var(--accent)",   text: "Strong ✓" },
  ];
  const lvl = levels[score] || levels[0];
  fill.style.width = lvl.pct;
  fill.style.background = lvl.color;
  label.textContent = lvl.text;
  label.style.color = lvl.color;
}

async function handleRegister() {
  hideBanner();
  const full_name = document.getElementById("reg-name").value.trim();
  const email     = document.getElementById("reg-email").value.trim();
  const password  = document.getElementById("reg-password").value;

  if (!full_name || !email || !password) {
    showBanner("Please fill in all fields.");
    return;
  }

  setLoading(true);
  try {
    const res  = await fetch(`${API}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name, email, password })
    });
    const data = await res.json();

    if (!data.ok) {
      showBanner(data.error || "Registration failed.");
      return;
    }

    showBanner("Account created! Signing you in…", "success");

    // Auto-login after registration
    setTimeout(async () => {
      const lRes  = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const lData = await lRes.json();
      if (lData.ok) {
        localStorage.setItem("orchestrai_token", lData.token);
        localStorage.setItem("orchestrai_user",  JSON.stringify(lData.user));
        window.location.href = "/";
      }
    }, 1000);

  } catch (e) {
    showBanner("Network error — is the server running?");
  } finally {
    setLoading(false);
  }
}

// Redirect if already logged in
if (localStorage.getItem("orchestrai_token")) {
    window.location.href = "/";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") handleRegister();
});
</script>
</body>
</html>
