<!--
  MY COURSES MODAL + COURSE READER MODAL
  Functionality: js/my-courses.js (openMyCoursesModal, closeMyCoursesModal,
  toggleCourseSearch, filterSavedCourses, viewCloudCourse, deleteCloudCourse,
  closeCourseReader, downloadHistoryPDF)
  Loaded into #my-courses-mount in ai_course_creator.html
  Bundled together because Course Reader is only ever opened from My Courses.
-->
<div class="modal-overlay" id="my-courses-modal" onclick="closeMyCoursesModal(event)">
  <div class="modal-card" style="max-width: 820px; width: 95%; max-height: 92vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 24px;" onclick="event.stopPropagation()">
    
    <div class="modal-header" style="padding: 24px; border-bottom: 1px solid var(--border); margin: 0; background: var(--surface); flex-shrink: 0;">
      <h2 class="modal-title" style="font-size: 22px;">My Courses</h2>
      <button class="modal-close" onclick="closeMyCoursesModal()">&times;</button>
    </div>
    
    <div class="modal-body my-courses-scroll-area" style="flex: 1; overflow-y: auto; padding: 24px; background: var(--bg);">
      
      <div class="my-courses-actions" style="display: flex; gap: 12px; margin-bottom: 16px;">
         <button class="btn btn-primary" style="flex: 1; border-radius: 12px; padding: 14px; justify-content: center; font-size: 14px;" onclick="closeMyCoursesModal(); window.location.reload();">
           <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
           Create Course
         </button>
         
         <button class="btn btn-green" style="flex: 1; border-radius: 12px; padding: 14px; justify-content: center; font-size: 14px;" onclick="toggleCourseSearch()">
           <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
           Search Course
         </button>
      </div>

      <div id="course-search-container" style="display: none; margin-bottom: 24px;">
         <input type="text" id="course-search-input" placeholder="Search by course topic..." style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); font-family: inherit; font-size: 15px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);" onkeyup="filterSavedCourses()">
      </div>

      <div id="my-courses-grid">
      </div>
      
    </div>
  </div>
</div>

<div class="modal-overlay" id="course-reader-modal" onclick="closeCourseReader(event)">
  <div class="modal-card reader-modal-card" onclick="event.stopPropagation()">
    <div class="modal-header reader-modal-header">
      <div class="reader-modal-title-group">
        <div class="reader-modal-eyebrow">Course Content</div>
        <h2 class="modal-title" id="reader-title">Course</h2>
      </div>
      <button class="modal-close" onclick="closeCourseReader()">&times;</button>
    </div>
    <div class="reader-modal-scroll" id="reader-content">
      </div>
  </div>
</div>
